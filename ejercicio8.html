<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = Number(prompt("Escribe un número"));
        let b = Number(prompt("Escribe otro número"));

        if(a > b){
            alert("El mayor es " + a);
        }else if(a == b){
            alert("Son iguales");
        }else{
            alert("El mayor es " + b);
        }

    </script>
</body>
</html>
