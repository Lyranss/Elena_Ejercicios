<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let numero = Number(prompt("Escribe un número"));
        let acertado = false;
        let contador = 0;

        while(contador != 5 && !acertado){
            let resp = Number(prompt("Escribe un número"));
            if(numero == resp){
                acertado = true;
            }
            contador++;
        }

        if(acertado){
            alert("Has acertado");
        }else{
            alert("Has perdido");
        }
    </script>
</body>
</html>
