<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <script>
        let iguales = "";
        let numero1 = Number(prompt("Escribe un número"));
        let numero2 = Number(prompt("Escribe un número"));
        if(numero1 == numero2){
            alert("Ya has introducido este número");
            iguales += "El 1 y 2 son iguales \n"
        }
        let numero3 = Number(prompt("Escribe un número"));
        if(numero2 == numero3){
            iguales += "El 2 y el 3 son iguales\n"
            alert("Ya has introducido este número");
        }else if(numero1 == numero3){
            iguales += "El 1 y el 3 son iguales\n"
            alert("Ya has introducido este número");
        }
        let numero4 = Number(prompt("Escribe un número"));
        if(numero4 == numero3){
            iguales +="El 4 y el 3 son iguales\n"
            alert("Ya has introducido este número");
        }else if(numero2 == numero4){
            iguales += "El 2 y el 4 son iguales\n"
            alert("Ya has introducido este número");
        }else if(numero1 == numero4){
            iguales += "El 1 y el 4 son iguales\n"
            alert("Ya has introducido este número");
        }
        let numero5 = Number(prompt("Escribe un número"));
        if(numero4 == numero5){
            iguales += "El 4 y el 5 son iguales\n"
            alert("Ya has introducido este número");
        }else if(numero2 == numero5){
            iguales += "El 2 y el 5 son iguales\n"
            alert("Ya has introducido este número");
        }else if(numero1 == numero5){
            iguales += "El 1 y el 5 son iguales\n"
            alert("Ya has introducido este número");
        }else if(numero3 == numero5){
            iguales += "El 3 y el 5 son iguales\n"
            alert("Ya has introducido este número");
        }

        let mayor = numero1;
        let posicion = 1;
        if (mayor < numero2) {
            mayor = numero2;
            posicion = 2;
        }
        if (mayor < numero3) {
            mayor = numero3;
            posicion = 3;
        }
        if (mayor < numero4) {
            mayor = numero4;
            posicion = 4;
        }
        if (mayor < numero5) {
            mayor = numero5;
            posicion = 5;
        }
        alert("El mayor es " + mayor + " y es el " + posicion);
        if(iguales != ""){
            alert(iguales);
        }
        
    </script>
</body>
