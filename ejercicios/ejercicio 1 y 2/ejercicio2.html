<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let numeros = [];
        for(let i = 0; i < 5; i++){
            numeros[i] = Number(prompt("Escribe un número"));
        }

        let mayor = numeros[0];
        let posicion = 0;
        for(let i = 1; i < numeros.length; i++){
            if(mayor < numeros[i]){
                console.log(mayor);
                console.log(numeros[i]);
                mayor = numeros[i];
                posicion = i;
                console.log(mayor);
            }
        }
        console.log(numeros);
        console.log("El mayor es " + mayor + " y es el " + (posicion+1));
    </script>
</body>
</html>
