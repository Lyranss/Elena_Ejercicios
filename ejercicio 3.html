<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        let simples = Number(prompt("Precio de habitación simple"));
        let dobles = Number(prompt("Precio de habitación doble"));
        let suite = Number(prompt("Precio de habitación suite"));

        let cantNoches = Number(prompt("Cantidad de noches"));
        let tipoHab = prompt("Tipo de habitación");

        let precioTotal = 0;
        if(tipoHab == "simple"){
            precioTotal = simples * cantNoches;
        }else if(tipoHab == "dobles"){
            precioTotal = dobles*cantNoches;
        }else if(tipoHab == "suite"){
            precioTotal = suite*cantNoches;
        }else{
            alert("Habitación no válida");
        }

        alert("Precio total: " + precioTotal + "€");
    </script>
</body>
</html>
