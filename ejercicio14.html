<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let aprobado = true;
        let media = 0;
        let notas = [];
        let notasMedias = [];
        for(let i = 0; i < 3; i++){
            notas[i] = [];
            for(let j = 0; j < 4; j++){
                if(j == 3){
                    notas[i][j] = parseFloat(prompt("Evaluacion " + (i+1) + ": Nota de Recuperación"));
                    if(notas[i][j] >= 5 && !aprobado){
                        aprobado = true;
                    }
                }else{
                    notas[i][j] = parseFloat(prompt("Evaluacion " + (i+1) + ": Nota de Examen " + (j+1)));
                    media += notas[i][j];
                    if(notas[i][j] <= 5){
                        aprobado = false;
                    }
                }
            }
            media /= 3;
            notasMedias[i] = media;
            media = 0;
        }

        if(notasMedias[0] < 70 || notasMedias[1] < 60 || notasMedias[2] < 50){
            aprobado = false;
        }

        if(!aprobado){
            for(let i = 0; i < notas.length; i++){
                if(notas[i][3] >= 5){
                    aprobado = true;
                }
            }
        }

        if(aprobado){
            alert("Aprobado");
        }else{
            alert("Suspenso");
        }
    </script>
</body>
</html>
